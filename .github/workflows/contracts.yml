name: contracts
on: [push, pull_request]
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches Raspberry Pi OS Bookworm
      - run: python -m unittest discover -s tests -v
