# VisionPath runtime configuration, shared by the modules on the Pi.
# Change values here, never in the code.
# Another file can be used with:  set VISIONPATH_CONFIG=path\to\file.toml
# Relative paths are relative to the repository root.

[bus]
# ZeroMQ PUB/SUB. The bus process (python -m datalogger.bus) binds both
# endpoints below; every module (detection, fusion, tracking, risk, output,
# the datalogger, the replay harness) connects to them.
# Topic of every message = its msg_type. Payload = msg.to_json() (contract v1.0.0).
sub_endpoint = "tcp://127.0.0.1:5555"   # modules connect here to RECEIVE messages
pub_endpoint = "tcp://127.0.0.1:5556"   # modules connect here to SEND messages

[targets]
latency_p95_ms = 300           # sensor reading -> each pipeline stage, 95th percentile

[rates]
camera_hz = 30                 # proposed until measured

[datalogger]
db_path = "data/visionpath.db"     # on-device SQLite database
blackbox_dir = "data/blackbox"     # black box snapshots (.jsonl)
user_id = 1                        # the user this device belongs to
window_s = 30                      # black box keeps the last 30 s
near_miss_ttc_s = 1.0              # track.ttc_s below this = near miss
cooldown_s = 10                    # at most one snapshot of each kind per 10 s
flush_interval_s = 1.0             # commit logged rows to the database every second
